name: KKL radar archive

on:
  schedule:
    - cron: "5 * * * *"    # hourly, :05 past hour
  workflow_dispatch: {}       # manual run / backfill button

permissions:
  contents: write

concurrency:
  group: kkl-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Tesseract OCR (free, for clock-overlay reading)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Fetch KKL snapshot + rebuild daily
        run: python scripts/fetch_kkl.py

      - name: Restore rain DB cache
        uses: actions/cache@v4
        with:
          # kkl.db is a local cache, not committed: restore last run's copy
          # so backfill only processes new frames. Unique key per run forces
          # a fresh save in the post-job step (an exact key hit skips saving).
          path: data/kkl.db
          key: kkl-db-${{ github.run_id }}
          restore-keys: kkl-db-

      - name: Backfill rain DB + export table data
        run: |
          # Ingest any new frames into SQLite, rebuild hourly_rain, and
          # refresh the CSVs + docs/data/rain.json the rain table reads.
          # (data/kkl.db itself is not committed: binary, regrows hourly,
          # fully rebuildable via backfill.)
          # init is idempotent (schema + upsert) and syncs places from
          # data/places.json — the single source of truth for locations —
          # on cold start and on every run (coordinate fixes propagate;
          # place_id stays stable).
          python scripts/kkl_db.py init
          python scripts/kkl_db.py backfill
          # Fill readings for places added after their frames were ingested
          # (idempotent; no-op when nothing is missing). Needs full history
          # (fetch-depth: 0 above): legacy _last.png sources deleted from
          # HEAD are recovered from git blobs.
          python scripts/kkl_db.py fill-missing
          python scripts/kkl_db.py export

      - name: Commit + push
        run: |
          git config user.name "kkl-archiver[bot]"
          git config user.email "kkl-archiver[bot]@users.noreply.github.com"
          git add docs/archive docs/data/index.json docs/data/rain.json data/latest.csv data/timeseries.csv data/frames.csv
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "[bot] KKL $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          # Remote may have moved between checkout and push (manual commit or
          # another run) -> plain `git push` fails non-fast-forward.
          # Rebase onto latest and retry so one new frame never drops the run.
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $i), pulling --rebase and retrying..."
            git fetch origin
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"; then
              echo "rebase conflict, aborting rebase and retrying fetch..."
              git rebase --abort || true
              sleep 5
              continue
            fi
            sleep 2
          done
          git status --short --branch
