name: KKL radar archive

on:
  schedule:
    - cron: "5 * * * *"    # hourly, :05 past hour
  workflow_dispatch: {}       # manual run / backfill button

permissions:
  contents: write

concurrency:
  group: kkl-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Tesseract OCR (free, for clock-overlay reading)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Fetch KKL snapshot + rebuild daily
        run: python scripts/fetch_kkl.py

      - name: Prune per-frame images older than 30 days (keep daily summaries)
        env:
          RETENTION_DAYS: "30"
        run: |
          # Raw GIFs are never committed (frames are extracted in memory and
          # the GIF is discarded). This only prunes per-frame images (+ any
          # legacy *-IST.gif) so old days keep daily.gif/strip.png/_last.png.
          # NOTE: deleting files only shrinks the working tree; git history
          # still retains old blobs, so squash history if the clone gets
          # heavy (see README "Repo size").
          python - <<'EOF'
          from pathlib import Path
          import datetime, os
          retention = int(os.environ.get("RETENTION_DAYS", "30"))
          cutoff = datetime.date.today() - datetime.timedelta(days=retention)
          for d in sorted(Path("docs/archive").glob("????-??-??")):
              try:
                  dt = datetime.date.fromisoformat(d.name)
              except ValueError:
                  continue
              if dt < cutoff:
                  for f in d.glob("*-IST.gif"):
                      f.unlink(missing_ok=True)
                  import shutil
                  shutil.rmtree(d / "frames", ignore_errors=True)
                  print(f"pruned frames in {d.name} (kept daily.gif/strip.png/_last.png)")
          EOF
          python - <<'EOF'
          # re-index after prune
          import sys; sys.path.insert(0, "scripts")
          from fetch_kkl import rebuild_index
          rebuild_index()
          EOF

      - name: Restore rain DB cache
        uses: actions/cache@v4
        with:
          # kkl.db is a local cache, not committed: restore last run's copy
          # so backfill only processes new frames. Unique key per run forces
          # a fresh save in the post-job step (an exact key hit skips saving).
          path: data/kkl.db
          key: kkl-db-${{ github.run_id }}
          restore-keys: kkl-db-

      - name: Backfill rain DB + export table data
        run: |
          # Ingest any new frames into SQLite, rebuild hourly_rain, and
          # refresh the CSVs + docs/data/rain.json the rain table reads.
          # (data/kkl.db itself is not committed: binary, regrows hourly,
          # fully rebuildable via backfill.)
          # init is idempotent (CREATE TABLE IF NOT EXISTS + INSERT OR
          # IGNORE) and seeds places from samples/kkl-jaffna/ on cold start.
          python scripts/kkl_db.py init
          python scripts/kkl_db.py backfill
          python scripts/kkl_db.py export

      - name: Commit + push
        run: |
          git config user.name "kkl-archiver[bot]"
          git config user.email "kkl-archiver[bot]@users.noreply.github.com"
          git add docs/archive docs/data/index.json docs/data/rain.json data/latest.csv data/timeseries.csv data/frames.csv
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "[bot] KKL $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          # Remote may have moved between checkout and push (manual commit or
          # another run) -> plain `git push` fails non-fast-forward.
          # Rebase onto latest and retry so one new frame never drops the run.
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $i), pulling --rebase and retrying..."
            git fetch origin
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"; then
              echo "rebase conflict, aborting rebase and retrying fetch..."
              git rebase --abort || true
              sleep 5
              continue
            fi
            sleep 2
          done
          git status --short --branch
